[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lra-companion"
version = "0.1.0"
description = "One continuous local AI companion with source-grounded long-term memory"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
search_train = ["peft>=0.15"]
semantic = ["sentence-transformers>=3,<6"]
model = ["transformers>=4.45,<6", "safetensors>=0.4", "torch>=2.2"]

[project.scripts]
lra = "lra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
