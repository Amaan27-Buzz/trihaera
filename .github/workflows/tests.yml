name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight dependencies
        run: python -m pip install -e '.[dev]'
      - name: CPU tests (no model download)
        run: python -m pytest -q
      - name: CLI help
        run: python -m lra --help
