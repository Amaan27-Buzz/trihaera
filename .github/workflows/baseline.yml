name: Model baseline CPU checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Pure Python tests
        run: python -m pytest -q
      - name: Check script argument parsing and syntax
        run: |
          python -m compileall -q src scripts
          python scripts/benchmark_models.py --help
